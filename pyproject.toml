[project]
name = "autored"
version = "0.1.0"
description = "AutoRed — Autonomous Red Team Copilot"
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.2.45",
    "langchain-anthropic==0.2.4",
    "langchain-openai==0.2.10",
    "anthropic>=0.40.0",
    "pydantic==2.9.2",
    "typer==0.12.5",
    "click>=8.0,<8.2",
    "rich==13.9.2",
    "structlog==24.4.0",
    "chromadb==0.5.13",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "pyyaml==6.0.2",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "msgpack==1.1.0",
    "textual==0.79.1",
    "impacket==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.7.1",
]

[project.scripts]
autored = "autored.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-httpx==0.35.0",
    "ruff==0.7.1",
]

[tool.setuptools.packages.find]
include = ["autored*"]
